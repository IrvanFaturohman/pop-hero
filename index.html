  <body>
    <div id="game"></div>
    <div id="boot"><div id="boot-msg">Loading…</div></div>
    <script>
      // Show load progress and any startup error on screen (no devtools on phones).
      (function () {
        function show(msg) {
          var boot = document.getElementById('boot');
          if (!boot) return;
          var el = document.createElement('div');
          el.className = 'err';
          el.textContent = msg;
          boot.appendChild(el);
        }
        window.addEventListener('error', function (e) {
          show('Error: ' + (e.message || e.type) + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          show('Error: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
        });
        setTimeout(function () {
          var m = document.getElementById('boot-msg');
          if (m) m.textContent = 'Still loading… (check Wi-Fi)';
        }, 12000);
      })();
    </script>
  </body>
